<script>
var REVIEW_BATCHES=[],CURRENT_SCAN_URL='',CURRENT_ROW_NUMBER=null,CURRENT_AIRTABLE_VALIDATION_RECORD_ID='',CURRENT_BATCH_INDEX=null,CURRENT_ROW_INDEX=null,SHOULD_SCROLL_ON_DETAIL_LOAD=false,RESTORE_SCROLL_Y=null,BATCH_EDIT_MODE=false,TICKET_EDIT_MODE=true,SELECTED_TICKET_ROWS={},ARCHIVED_BATCH_VISIBILITY={},PREVIOUS_BATCH_EXPANSION={},SHOW_PREVIOUS_BATCHES=false,PREVIOUS_BATCHES_AUTOLOAD_ATTEMPTED=false,REVIEW_QUEUE_SOURCE='AIRTABLE_TEST',DETAIL_RESTORE_KEY='diane.ticketDetail.restore.v1',PENDING_DETAIL_RESTORE=true;
var APPROVAL_REQUIRED_FIELDS=[
{id:'ticketNumber',label:'Ticket #',type:'text'},{id:'ticketDate',label:'Ticket Date',type:'text'},
{id:'broker',label:'Broker',type:'text'},{id:'customerJob',label:'Customer / Job',type:'text'},
{id:'poNumber',label:'PO Number',type:'text'},{id:'truck',label:'Truck',type:'text'},
{id:'driver',label:'Driver',type:'text'},{id:'material',label:'Material',type:'text'},
{id:'quantity',label:'Quantity',type:'zeroOrPositiveNumber'},{id:'rate',label:'Rate',type:'zeroOrPositiveNumber'},
{id:'reviewer',label:'Reviewer',type:'text'}
];
function setStatus(m){var s=document.getElementById('status');if(s)s.textContent=m;}
function updatePreviousBatchesButton(){var b=document.getElementById('previousBatchesButton');if(!b)return;b.textContent=SHOW_PREVIOUS_BATCHES?'Hide Previous Batches':'View Previous Batches';}
function togglePreviousBatches(){SHOW_PREVIOUS_BATCHES=!SHOW_PREVIOUS_BATCHES;updatePreviousBatchesButton();reloadBatches();}
function setSaveStatus(m,t){var s=document.getElementById('saveStatus');s.className='save-status';if(t)s.classList.add(t);s.textContent=m;}
function setBatchSaveStatus(m,t){var s=document.getElementById('batchSaveStatus');if(!s)return;s.className='save-status';if(t)s.classList.add(t);s.textContent=m;}
function setApprovalAlert(m){var a=document.getElementById('approvalAlert');if(!a)return;if(!m){a.textContent='';a.classList.remove('visible');return;}a.textContent=m;a.classList.add('visible');}
function clearFieldErrors(){APPROVAL_REQUIRED_FIELDS.forEach(function(f){var i=document.getElementById(f.id);if(i)i.classList.remove('field-error');});}
function markFieldError(id){var i=document.getElementById(id);if(i)i.classList.add('field-error');}
function getDrivePreviewUrl(url){var m=String(url||'').match(/\/d\/([^/]+)/);return m?'https://drive.google.com/file/d/'+m[1]+'/preview':String(url||'');}
function openScanReviewWindow(){if(!CURRENT_SCAN_URL){alert('No scan URL found.');return;}window.open(CURRENT_SCAN_URL,'DianeScanReview','width=1050,height=900,left=40,top=40,resizable=yes,scrollbars=yes');}
function setReplaceScanStatus(m,t){var s=document.getElementById('replaceScanStatus');if(!s)return;s.className='save-status';if(t)s.classList.add(t);s.textContent=m;}
function isAirtableReviewSource(source){var normalized=String(source||'').trim().toUpperCase();return normalized==='AIRTABLE'||normalized==='AIRTABLE_TEST';}
function toggleReplaceScanPanel(){var p=document.getElementById('replaceScanPanel');if(!p)return;p.classList.toggle('hidden');}
function updateCurrentScanUrl(url,fileName){CURRENT_SCAN_URL=url||'';var row=getCurrentRow();if(row){row.sourceFileUrl=url||row.sourceFileUrl;row.sourceFileName=fileName||row.sourceFileName;}var open=document.getElementById('openScanButton');if(open)open.href=CURRENT_SCAN_URL||'#';var frame=document.getElementById('scanFrame');if(frame)frame.src=getDrivePreviewUrl(CURRENT_SCAN_URL);}
function replaceCurrentTicketScan(){if(REVIEW_QUEUE_SOURCE==='AIRTABLE_TEST'&&!CURRENT_AIRTABLE_VALIDATION_RECORD_ID){setReplaceScanStatus('No active Airtable ticket selected.','error');return;}if(REVIEW_QUEUE_SOURCE!=='AIRTABLE_TEST'&&!CURRENT_ROW_NUMBER){setReplaceScanStatus('No active ticket selected.','error');return;}var fileInput=document.getElementById('replaceScanFile');var file=fileInput&&fileInput.files&&fileInput.files[0];if(!file){setReplaceScanStatus('Choose a corrected image or PDF first.','error');return;}var btn=document.getElementById('replaceScanButton');if(btn){btn.disabled=true;btn.textContent='Uploading...';}setReplaceScanStatus('Uploading replacement scan...','');var reader=new FileReader();reader.onload=function(e){var payload={source:REVIEW_QUEUE_SOURCE,validationRecordId:CURRENT_AIRTABLE_VALIDATION_RECORD_ID,rowNumber:CURRENT_ROW_NUMBER,fileName:file.name,mimeType:file.type||'application/octet-stream',dataBase64:e.target.result,notes:getInputValue('replaceScanNotes'),reviewer:getReviewer()||getInputValue('detailBatchReviewer')||'system'};google.script.run.withSuccessHandler(function(r){if(btn){btn.disabled=false;btn.textContent='Upload Replacement Scan';}setReplaceScanStatus(r.message||'Replacement scan uploaded.','success');updateCurrentScanUrl(r.fileUrl,r.fileName);if(fileInput)fileInput.value='';}).withFailureHandler(function(err){if(btn){btn.disabled=false;btn.textContent='Upload Replacement Scan';}setReplaceScanStatus('Replacement upload failed: '+String(err&&err.message?err.message:err),'error');}).replaceTicketScan(payload);};reader.onerror=function(){if(btn){btn.disabled=false;btn.textContent='Upload Replacement Scan';}setReplaceScanStatus('Could not read selected file.','error');};reader.readAsDataURL(file);}
function createTextCell(t){var td=document.createElement('td');td.textContent=t||'';return td;}
function createStatusBadge(label,cls){var b=document.createElement('span');b.className='badge '+(cls||'status-new');b.textContent=label||'New';return b;}
function getTicketSelectionId(row){if(!row)return '';return row.validationRecordId||row.rowNumber||'';}
function getSelectedTicketIds(){return Object.keys(SELECTED_TICKET_ROWS).filter(function(id){return SELECTED_TICKET_ROWS[id];});}
function updateSelectionToolbar(){var rows=getSelectedTicketIds();var tb=document.getElementById('selectionToolbar');var ct=document.getElementById('selectionCount');if(ct)ct.textContent=rows.length+' selected';updateExistingBatchDropdown();if(tb)tb.classList[rows.length?'remove':'add']('hidden');}
function toggleTicketSelection(selectionId,checked){if(!selectionId)return;selectionId=String(selectionId);if(checked)SELECTED_TICKET_ROWS[selectionId]=true;else delete SELECTED_TICKET_ROWS[selectionId];updateSelectionToolbar();}
function clearSelectedTickets(){SELECTED_TICKET_ROWS={};var boxes=document.querySelectorAll('.ticket-select-checkbox,.batch-select-all-checkbox');for(var i=0;i<boxes.length;i++){boxes[i].checked=false;boxes[i].indeterminate=false;}updateSelectionToolbar();}
function isSelectableTicketForBatch(row){return !!(getTicketSelectionId(row)&&row.statusCode!=='PROCESSED');}
function setBatchTicketsSelected(batchIndex,checked){var batch=REVIEW_BATCHES[batchIndex];if(!batch||!batch.rows)return;batch.rows.forEach(function(row){var id=getTicketSelectionId(row);if(isSelectableTicketForBatch(row)){if(checked)SELECTED_TICKET_ROWS[String(id)]=true;else delete SELECTED_TICKET_ROWS[String(id)];}});renderBatches(REVIEW_BATCHES);updateSelectionToolbar();}
function selectBatchTickets(batchIndex){setBatchTicketsSelected(batchIndex,true);}
function getBatchDisplayLabel(batch){
  var key=String(batch&&batch.batchKey||'').trim();
  var weekly=key.match(/^WEEK_\d{4}-\d{2}-\d{2}.*TO.*(\d{4}-\d{2}-\d{2})$/i);
  if(weekly)return 'Week Ending '+weekly[1];
  return String(batch&&(batch.batchTitle||batch.batchKey)||'Review Batch');
}
function getExistingManualBatches(){
  return(REVIEW_BATCHES||[]).filter(function(batch){
    return batch &&
      batch.batchRecordId &&
      batch.rows &&
      batch.rows.length &&
      ['APPROVED','PROCESSED','DO_NOT_BILL','EMPTY']
        .indexOf(batch.statusCode) === -1;
  });
}
function updateExistingBatchDropdown(){var sel=document.getElementById('existingBatchSelect');if(!sel)return;var current=sel.value;sel.innerHTML='';var ph=document.createElement('option');ph.value='';ph.textContent='Add / Remove';sel.appendChild(ph);var remove=document.createElement('option');remove.value='__REMOVE_SELECTED_FROM_BATCH__';remove.textContent='Remove selected from batch';sel.appendChild(remove);getExistingManualBatches().forEach(function(batch){var o=document.createElement('option');o.value=isAirtableReviewSource(REVIEW_QUEUE_SOURCE)?batch.batchRecordId:batch.batchKey;o.textContent=getBatchDisplayLabel(batch)+' ('+(batch.ticketCount||0)+' tickets)';sel.appendChild(o);});if(current){for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===current){sel.value=current;break;}}}}
function generateManualBatchRequestId(){return 'mb_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,12);}
function setManualBatchButtonBusy(busy){var b=document.getElementById('createBatchButton');if(!b)return;b.disabled=busy;b.textContent=busy?'Creating batch...':'Create Batch from Selected';}
function addSelectedTicketsToExistingBatch(){var ids=getSelectedTicketIds();var sel=document.getElementById('existingBatchSelect');var target=sel?sel.value:'';if(!ids.length){setStatus('Select at least 1 ticket first.');return;}if(target==='__REMOVE_SELECTED_FROM_BATCH__'){removeSelectedTicketsFromBatch();return;}if(!target){setStatus('Choose an existing batch first.');return;}setStatus('Adding selected tickets to batch...');var payload=isAirtableReviewSource(REVIEW_QUEUE_SOURCE)?{source:REVIEW_QUEUE_SOURCE,validationRecordIds:ids,targetBatchRecordId:target,clientRequestId:generateManualBatchRequestId()}:{rowNumbers:ids,targetBatchKey:target,reviewer:''};google.script.run.withSuccessHandler(function(r){clearSelectedTickets();setStatus(r.message||'Tickets added to batch. Reloading...');reloadBatches();hydrateOverviewReviewer();}).withFailureHandler(function(e){setStatus('Add to batch failed: '+String(e&&e.message?e.message:e));updateSelectionToolbar();}).addSelectedTicketsToExistingBatch(payload);}
function toggleArchivedBatch(batchKey){if(!batchKey)return;ARCHIVED_BATCH_VISIBILITY[batchKey]=!ARCHIVED_BATCH_VISIBILITY[batchKey];renderBatches(REVIEW_BATCHES);updateSelectionToolbar();}
function togglePreviousBatchDetails(batchKey){if(!batchKey)return;PREVIOUS_BATCH_EXPANSION[batchKey]=!PREVIOUS_BATCH_EXPANSION[batchKey];renderBatches(REVIEW_BATCHES);updateSelectionToolbar();}
function getOverviewReviewer(){var i=document.getElementById('overviewReviewer');var v=i?String(i.value||'').trim().toLowerCase():'';if(v){try{localStorage.setItem('dianeReviewerInitials',v);}catch(e){}return v;}try{return String(localStorage.getItem('dianeReviewerInitials')||'').trim().toLowerCase();}catch(e){return '';}}
function setOverviewReviewer(v){v=String(v||'').trim().toLowerCase();var i=document.getElementById('overviewReviewer');if(i)i.value=v;try{if(v)localStorage.setItem('dianeReviewerInitials',v);}catch(e){}}
function hydrateOverviewReviewer(){setOverviewReviewer(getOverviewReviewer());}
function approveSelectedTickets(){var ids=getSelectedTicketIds();if(!ids.length){setStatus('Select at least 1 ticket to approve.');return;}if(isAirtableReviewSource(REVIEW_QUEUE_SOURCE)){setStatus('Bulk approval is not available yet for Airtable records. Review and approve each ticket individually.');return;}approveBatchByKey('SELECTED_ROWS',getOverviewReviewer(),function(r){clearSelectedTickets();setStatus((r&&r.message)||'Selected tickets approved. Reloading...');reloadBatches();},ids);}


function createBatchFromSelected(){var ids=getSelectedTicketIds();if(ids.length<2){setStatus('Select at least 2 tickets to create a batch.');return;}var tb=document.getElementById('selectionToolbar');if(tb)tb.classList.add('loading');setManualBatchButtonBusy(true);setStatus('Creating manual batch from '+ids.length+' selected tickets...');var payload=isAirtableReviewSource(REVIEW_QUEUE_SOURCE)?{source:REVIEW_QUEUE_SOURCE,validationRecordIds:ids,clientRequestId:generateManualBatchRequestId()}:{rowNumbers:ids,reviewer:''};google.script.run.withSuccessHandler(function(r){setManualBatchButtonBusy(false);clearSelectedTickets();setStatus(r.message||'Manual batch created. Reloading...');reloadBatches();}).withFailureHandler(function(e){setManualBatchButtonBusy(false);setStatus('Manual batch create failed: '+String(e&&e.message?e.message:e));updateSelectionToolbar();}).createManualBatchFromSelected(payload);}
function getInputValue(id){var i=document.getElementById(id);return i?(i.value||''):'';}
function setInputValue(id,v){var i=document.getElementById(id);if(!i)return;if(id==='broker'){var brokerValue=normalizeBrokerCode(v);i.dataset.pendingValue=brokerValue;i.value=brokerValue;return;}if(id==='reviewer'&&!String(v||'').trim())v=REVIEWER_DEFAULT_VALUE;i.value=(v===0||v==='0')?'0':(v||'');if(id==='truck'||id==='driver')syncDriverTruckSelector_();}
function setTextValue(id,v){var e=document.getElementById(id);if(e)e.textContent=(v===0||v==='0')?'0':(v||'Missing');}
function hasPayloadValue(v){return v===0||v==='0'||String(v||'').trim()!=='';}
var BROKER_MAP={ST:'Statewide Materials',SW:'Statewide Materials',NR:'Nickel Rock',TN:'Twisted Nail',TNB:'Twisted Nail'};
var BROKER_OPTIONS=[];
var REVIEWER_DEFAULT_VALUE='usroVCuQ6vu5oCeXW';
var DRIVER_TRUCK_OPTIONS=[{truck:'W01',driver:'DC',label:'Truck 1 - Clifton, David'},{truck:'W02',driver:'DS',label:'Truck 2 - Shelton, David'},{truck:'W03',driver:'DC',label:'Truck 3 - Clifton, David'}];
var DRIVER_MAP={DS:'David Shelton',DC:'David Clifton',EE:'Ernie Ernst'};
var TRUCK_MAP={W01:'Wright 01',W02:'Wright 02',W03:'Wright 03',TNB829:'TNB 829',TNB1141:'TNB 1141'};
var TRUCK_DEFAULT_DRIVER_MAP={W01:'DC',W02:'DS',W03:'DC'};
var AUTO_SUGGESTED_DRIVER='';
function normTruckKey(v){return String(v||'').trim().replace(/[^A-Za-z0-9]+/g,' ').replace(/\s+/g,' ').trim().toUpperCase();}
function getDisplayName(map,v){var t=String(v||'').trim();return map[t.toUpperCase()]||t||'Missing';}
function normalizeBrokerCode(v){var t=String(v||'').trim().toUpperCase();return t==='TNB'?'TN':t;}
function populateBrokerOptions(options){BROKER_OPTIONS=options||[];var select=document.getElementById('broker');if(!select)return;var current=normalizeBrokerCode(select.dataset.pendingValue||select.value);select.innerHTML='';var blank=document.createElement('option');blank.value='';blank.textContent='Select broker';select.appendChild(blank);BROKER_OPTIONS.forEach(function(item){var option=document.createElement('option');option.value=normalizeBrokerCode(item.code);option.textContent=normalizeBrokerCode(item.code)+' — '+item.name;select.appendChild(option);});if(current)select.value=current;}
function loadBrokerOptions(){google.script.run.withSuccessHandler(populateBrokerOptions).withFailureHandler(function(e){console.warn('Diane review app: broker options failed',e);}).getBrokerOptionsFromAirtable();}
function populateDriverTruckOptions_(){var select=document.getElementById('driverTruck');if(!select||select.dataset.optionsBound==='yes')return;select.innerHTML='';DRIVER_TRUCK_OPTIONS.forEach(function(item){var option=document.createElement('option');option.value=item.truck+'|'+item.driver;option.textContent=item.label;select.appendChild(option);});select.addEventListener('change',function(){var parts=String(select.value||'').split('|');setInputValue('truck',parts[0]||'');setInputValue('driver',parts[1]||'');});select.addEventListener('keydown',function(event){var key=String(event.key||'').toUpperCase();var aliases={W01:'W01|DC',W02:'W02|DS',W03:'W03|DC',DC:'W01|DC',DS:'W02|DS','01':'W01|DC','02':'W02|DS','03':'W03|DC'};if(aliases[key]){event.preventDefault();select.value=aliases[key];select.dispatchEvent(new Event('change'));}});select.dataset.optionsBound='yes';syncDriverTruckSelector_();}
function syncDriverTruckSelector_(){var select=document.getElementById('driverTruck');if(!select)return;var value=String(getInputValue('truck')||'')+'|'+String(getInputValue('driver')||'');if(value!=='|')select.value=value;}
function getDefaultDriverForTruck(v){return TRUCK_DEFAULT_DRIVER_MAP[normTruckKey(v)]||'';}
function resolveTruckAliasForCurrentContext(v){var batch=getCurrentBatch();var candidates=batch&&batch.truckAliasMap?batch.truckAliasMap[normTruckKey(v)]||[]:[];if(candidates.length===1)return candidates[0];var row=getCurrentRow()||{};var brokerKeys=[normTruckKey(row.broker),normTruckKey(batch&&batch.broker)].filter(Boolean).filter(function(key,index,all){return all.indexOf(key)===index;});var brokerMatches=candidates.filter(function(candidate){return candidate.brokerKeys.some(function(key){return brokerKeys.indexOf(key)!==-1;});});return brokerMatches.length===1?brokerMatches[0]:null;}
function applyTruckDefaultDriver(){var current=String(getInputValue('driver')||'').trim();if(current&&!AUTO_SUGGESTED_DRIVER){return;}if(current&&current!==AUTO_SUGGESTED_DRIVER){AUTO_SUGGESTED_DRIVER='';return;}var resolved=resolveTruckAliasForCurrentContext(getInputValue('truck'));var suggestion=resolved&&resolved.driverCode||getDefaultDriverForTruck(getInputValue('truck'));setInputValue('driver',suggestion);AUTO_SUGGESTED_DRIVER=String(suggestion||'').trim();}
function bindTruckDefaultDriverSuggestion(){populateDriverTruckOptions_();var truck=document.getElementById('truck');var driver=document.getElementById('driver');if(!truck||!driver||truck.dataset.defaultDriverBound==='yes')return;truck.dataset.defaultDriverBound='yes';truck.addEventListener('change',applyTruckDefaultDriver);driver.addEventListener('input',function(){var current=String(driver.value||'').trim();if(current!==AUTO_SUGGESTED_DRIVER)AUTO_SUGGESTED_DRIVER='';});}
function normNum(v){return String(v||'').trim().replace(/[$,]/g,'');}
function isPositiveNumber(v){var t=normNum(v);if(!t)return false;var n=Number(t);return !isNaN(n)&&n>=0;}
function formatMoney(v){var n=Number(v||0);return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function formatCurrencyOrBlank(v){var n=numberFromValue(v);return n===null?'':formatMoney(n);}
function numberFromValue(v){var t=normNum(v);if(!t)return null;var n=Number(t);return isNaN(n)?null:n;}
function getTicketInvoiceAmount(row){if(!row)return null;var existing=numberFromValue(row.lineTotal);if(existing!==null)return existing;var q=numberFromValue(row.quantity);var r=numberFromValue(row.rate);if(q===null||r===null)return null;return q*r;}
function getTicketDriverPay(row){var amt=getTicketInvoiceAmount(row);return amt===null?null:amt*.30;}
function getReviewer(){return getInputValue('reviewer').trim();}
function reviewerDisplay(v){return String(v||'')==='usroVCuQ6vu5oCeXW'?'Ernie Hathaway':'';}
function getCurrentBatch(){return(CURRENT_BATCH_INDEX!==null&&REVIEW_BATCHES[CURRENT_BATCH_INDEX])?REVIEW_BATCHES[CURRENT_BATCH_INDEX]:null;}
function getCurrentRow(){var b=getCurrentBatch();return(b&&CURRENT_ROW_INDEX!==null&&b.rows[CURRENT_ROW_INDEX])?b.rows[CURRENT_ROW_INDEX]:null;}
function isTicketNeedingReview(row){return row&&row.statusCode!=='APPROVED'&&row.statusCode!=='PROCESSED'&&row.statusCode!=='DO_NOT_BILL';}
function findNextReviewIndex(batch,cur){var rows=batch&&batch.rows?batch.rows:[];for(var i=cur+1;i<rows.length;i++){if(isTicketNeedingReview(rows[i]))return i;}for(var j=0;j<cur;j++){if(isTicketNeedingReview(rows[j]))return j;}return -1;}
function buildTicketPayload(){return{rowNumber:CURRENT_ROW_NUMBER,source:REVIEW_QUEUE_SOURCE,validationRecordId:CURRENT_AIRTABLE_VALIDATION_RECORD_ID,ticketNumber:getInputValue('ticketNumber'),ticketDate:getInputValue('ticketDate'),broker:normalizeBrokerCode(getInputValue('broker')),customerJob:getInputValue('customerJob'),poNumber:getInputValue('poNumber'),workOrder:getInputValue('workOrder'),truck:getInputValue('truck'),driver:getInputValue('driver'),material:getInputValue('material'),quantity:getInputValue('quantity'),rate:getInputValue('rate'),origin:getInputValue('origin'),destination:getInputValue('destination'),lineTotal:getInputValue('lineTotal'),reviewNotes:getInputValue('reviewNotes'),reviewer:getReviewer()};}
function validateApprovalFields(){var problems=[];clearFieldErrors();APPROVAL_REQUIRED_FIELDS.forEach(function(f){var v=getInputValue(f.id).trim();if(!v){problems.push(f.label+' is required.');markFieldError(f.id);return;}if(f.type==='zeroOrPositiveNumber'&&!isPositiveNumber(v)){problems.push(f.label+' must be a number 0 or greater.');markFieldError(f.id);}});return problems;}
function showApprovalBlocked(problems){setApprovalAlert('Approval blocked. '+problems.join(' '));setSaveStatus('No changes saved.','error');var a=document.getElementById('approvalAlert');if(a)a.scrollIntoView({behavior:'smooth',block:'center'});}
function clearApprovalBlocked(){setApprovalAlert('');clearFieldErrors();}
function buildBatchPayloadFromDetail(){var batch=getCurrentBatch();if(!batch)throw new Error('No active batch selected.');return{batchKey:batch.batchKey,broker:getInputValue('detailBatchBroker'),customerJob:getInputValue('detailBatchCustomerJob'),poNumber:getInputValue('detailBatchPoNumber'),workOrder:getInputValue('detailBatchWorkOrder'),origin:getInputValue('detailBatchOrigin'),destination:getInputValue('detailBatchDestination'),truck:getInputValue('detailBatchTruck'),driver:getInputValue('detailBatchDriver'),rate:getInputValue('detailBatchRate'),batchNotes:getInputValue('detailBatchNotes'),reviewer:getInputValue('detailBatchReviewer').trim().toLowerCase(),batchStatus:'Draft',applyToTickets:'No',formAction:'Save Batch Draft'};}
function updateSummary(){var row=getCurrentRow();if(row){var header=document.getElementById('headerStatus');if(header){header.textContent=row.statusLabel||row.statusCode||'Draft';header.className='badge '+(row.statusClassName||'status-draft');}var batch=getCurrentBatch();var total=batch&&batch.rows?batch.rows.length:0;var position=CURRENT_ROW_INDEX===null?0:CURRENT_ROW_INDEX+1;['recordPositionTop','recordPositionBottom','recordPositionEditTop','recordPositionEditBottom'].forEach(function(id){var e=document.getElementById(id);if(e)e.textContent='Record '+position+' of '+total;});}document.querySelectorAll('[data-ticket-summary-status]').forEach(function(s){s.innerHTML='';if(row)s.appendChild(createStatusBadge(row.statusLabel,row.statusClassName));});var line=document.getElementById('summaryLineTotal');var pay=document.getElementById('summaryDriverPay');var amt=getTicketInvoiceAmount(row);if(line)line.textContent=amt===null?'Missing':formatMoney(amt);if(pay)pay.textContent=amt===null?'Missing':formatMoney(amt*.30);}
function updateStaticBatchSummary(batch){setTextValue('staticBatchBroker',getDisplayName(BROKER_MAP,batch.broker));setTextValue('staticBatchCustomerJob',batch.customerJob);setTextValue('staticBatchPoNumber',batch.poNumber);setTextValue('staticBatchWorkOrder',batch.workOrder);setTextValue('staticBatchOrigin',batch.origin);setTextValue('staticBatchDestination',batch.destination);setTextValue('staticBatchTruck',getDisplayName(TRUCK_MAP,batch.truck));setTextValue('staticBatchDriver',getDisplayName(DRIVER_MAP,batch.driver));setTextValue('staticBatchRate',batch.rate);setTextValue('staticBatchReviewer',batch.reviewer);}
function updateStaticTicketSummary(p){setTextValue('staticTicketNumber',p.ticketNumber);setTextValue('staticTicketDate',p.ticketDate);setTextValue('staticTicketBroker',getDisplayName(BROKER_MAP,p.broker));setTextValue('staticTicketCustomerJob',p.customerJob);setTextValue('staticTicketPoNumber',p.poNumber);setTextValue('staticTicketWorkOrder',p.workOrder);setTextValue('staticTicketTruck',getDisplayName(TRUCK_MAP,p.truck));setTextValue('staticTicketDriver',getDisplayName(DRIVER_MAP,p.driver));setTextValue('staticTicketMaterial',p.material);setTextValue('staticTicketQuantity',p.quantity);var staticRate=document.getElementById('staticTicketRate');if(staticRate)staticRate.textContent=formatCurrencyOrBlank(p.rate);setTextValue('staticTicketOrigin',p.origin);setTextValue('staticTicketDestination',p.destination);setTextValue('staticTicketLineTotal',p.lineTotal);var staticReviewer=document.getElementById('staticTicketReviewer');if(staticReviewer)staticReviewer.textContent=reviewerDisplay(p.reviewer);}
function showBatchStaticView(){var batch=getCurrentBatch();if(!batch)return;updateStaticBatchSummary(batch);document.getElementById('batchStaticView').classList.remove('hidden');document.getElementById('batchEditView').classList.add('hidden');BATCH_EDIT_MODE=false;}
function showBatchEditView(){document.getElementById('batchStaticView').classList.add('hidden');document.getElementById('batchEditView').classList.remove('hidden');BATCH_EDIT_MODE=true;}
function editCurrentBatchFields(){var batch=getCurrentBatch();if(batch)fillDetailBatchPanel(batch);showBatchEditView();}
function updateSummarySaveVisibility(){var save=document.getElementById('saveButton');if(save)save.classList.toggle('hidden',!TICKET_EDIT_MODE);}
function showTicketStaticView(){updateStaticTicketSummary(buildTicketPayload());document.getElementById('ticketStaticView').classList.remove('hidden');document.getElementById('ticketEditView').classList.add('hidden');TICKET_EDIT_MODE=false;updateSummarySaveVisibility();updateReturnToDraftButton();updateNavButtons();}
function showTicketEditView(){document.getElementById('ticketStaticView').classList.add('hidden');document.getElementById('ticketEditView').classList.remove('hidden');TICKET_EDIT_MODE=true;updateSummarySaveVisibility();updateReturnToDraftButton();updateNavButtons();}
function editCurrentTicketFields(){showTicketEditView();}

function showListView(){clearTicketDetailRestoreState_();CURRENT_SCAN_URL='';CURRENT_ROW_NUMBER=null;CURRENT_BATCH_INDEX=null;CURRENT_ROW_INDEX=null;RESTORE_SCROLL_Y=null;BATCH_EDIT_MODE=false;TICKET_EDIT_MODE=true;document.getElementById('scanFrame').src='';document.getElementById('detailView').classList.add('hidden');document.getElementById('listView').classList.remove('hidden');reloadBatches();window.scrollTo(0,0);}
var showListViewOriginal=showListView;
showListView=function(){console.log('Diane restore later showListView() call.');showListViewOriginal.apply(this,arguments);};
function renderError(error){var app=document.getElementById('app');app.className='error';app.innerHTML='<strong>Something broke.</strong><br>'+String(error&&error.message?error.message:error);setStatus('Error loading review queue.');}
reloadBatches();


var CURRENT_SCAN_ROTATION=0;
var SCAN_WHEEL_ZOOM_ACTIVE=false;
var SCAN_ZOOM_SCALE=1.0;
function activateScanWheelZoom(event){
 if(event)event.stopPropagation();
 SCAN_WHEEL_ZOOM_ACTIVE=true;
 var overlay=document.getElementById('scanPreviewOverlay');
 if(overlay)overlay.classList.add('active');
}
function deactivateScanWheelZoom(){
 SCAN_WHEEL_ZOOM_ACTIVE=false;
 var overlay=document.getElementById('scanPreviewOverlay');
 if(overlay)overlay.classList.remove('active');
}
// Bug fix: removed document-level click handler that was calling deactivateScanWheelZoom()
// whenever any form field was clicked. That handler caused the scan overlay to reappear
// over the iframe each time the user typed in a field, making the image go blank.
// Zoom stays active until navigating to a new ticket or the list view.
(function(){
 var wrap=document.getElementById('scanPreviewWrap');
 if(!wrap)return;
 // Wheel zoom: scale the iframe with CSS transform for consistent in/out zoom.
 // preventDefault stops both page scroll and cross-origin iframe scroll from firing.
 wrap.addEventListener('wheel',function(e){
  e.preventDefault();
  e.stopPropagation();
  var delta=e.deltaY<0?0.15:-0.15;
  SCAN_ZOOM_SCALE=Math.max(0.4,Math.min(4.0,SCAN_ZOOM_SCALE+delta));
  applyScanRotation_();
 },{passive:false});
})();
function normalizeScanRotation_(deg){var n=deg%360;if(n<0)n+=360;return n;}
function applyScanRotation_(){var frame=document.getElementById('scanFrame');var label=document.getElementById('scanRotationLabel');if(!frame)return;var deg=normalizeScanRotation_(CURRENT_SCAN_ROTATION);var rotScale=(deg===90||deg===270)?0.72:1;frame.style.transform='rotate('+deg+'deg) scale('+(SCAN_ZOOM_SCALE*rotScale)+')';frame.style.transformOrigin='center center';if(label)label.textContent=deg+'°';}
function rotateScanPreview(delta){CURRENT_SCAN_ROTATION=normalizeScanRotation_(CURRENT_SCAN_ROTATION+delta);applyScanRotation_();}
function resetScanRotation(){CURRENT_SCAN_ROTATION=0;SCAN_ZOOM_SCALE=1.0;applyScanRotation_();}
function updateBatchSummary_(batch){
 if(!batch)return;
 setTextValue('summaryTicketCount',batch.ticketCount||0);
 setTextValue('summaryBatchStatus',batch.statusLabel||batch.statusCode||'');
}







function getCurrentBatchValidationRecordIds_(){
 var batch=getCurrentBatch();
 return (batch&&batch.rows||[]).map(function(row){return row.validationRecordId;}).filter(Boolean);
}

function applySharedFieldsToAllTickets(){
 var batch=getCurrentBatch();
 var ids=getCurrentBatchValidationRecordIds_();
 if(!isAirtableReviewSource(REVIEW_QUEUE_SOURCE)){setSaveStatus('Shared-field copy is available only for Airtable records.','error');return;}
 if(!batch||!batch.batchRecordId||!ids.length){setSaveStatus('No tickets are available in this batch.','error');return;}
 if(!confirm('Apply the current shared fields to all tickets in this batch?'))return;
 var payload={source:REVIEW_QUEUE_SOURCE,targetBatchRecordId:batch.batchRecordId,validationRecordIds:ids,broker:getInputValue('broker'),customerJob:getInputValue('customerJob'),poNumber:getInputValue('poNumber'),workOrder:getInputValue('workOrder'),origin:getInputValue('origin'),destination:getInputValue('destination'),truck:getInputValue('truck'),driver:getInputValue('driver'),material:getInputValue('material'),rate:getInputValue('rate')};
 setSaveStatus('Applying shared fields to all tickets...','');
 google.script.run.withSuccessHandler(function(r){setSaveStatus(r.message||'Shared fields applied.','success');reloadBatches();}).withFailureHandler(function(e){setSaveStatus('Shared-field copy failed: '+String(e&&e.message?e.message:e),'error');}).applySharedFieldsToAllTickets(payload);
}

function removeCurrentTicketFromBatch(){
 var row=getCurrentRow();var batch=getCurrentBatch();
 if(!row||!row.validationRecordId||!batch||!batch.batchRecordId){setSaveStatus('No active batch ticket selected.','error');return;}
 if(!confirm('Remove this ticket from the batch?'))return;
 google.script.run.withSuccessHandler(function(r){setStatus(r.message||'Ticket removed from batch. Reloading...');reloadBatches();}).withFailureHandler(function(e){setSaveStatus('Remove from batch failed: '+String(e&&e.message?e.message:e),'error');}).removeTicketsFromBatch({source:REVIEW_QUEUE_SOURCE,validationRecordIds:[row.validationRecordId],targetBatchRecordId:batch.batchRecordId});
}



function removeSelectedTicketsFromBatch(){
 var ids=getSelectedTicketIds();if(!ids.length){setStatus('Select at least 1 ticket first.');return;}
 var targetBatchRecordId='';var batchCount=0;
 (REVIEW_BATCHES||[]).forEach(function(batch){var has= (batch.rows||[]).some(function(row){return ids.indexOf(String(getTicketSelectionId(row)))>=0;});if(has){batchCount++;targetBatchRecordId=batch.batchRecordId||'';}});
 if(batchCount!==1||!targetBatchRecordId){setStatus('Select tickets from one batch only.');return;}
 if(!confirm('Remove '+ids.length+' selected ticket(s) from this batch?'))return;
 google.script.run.withSuccessHandler(function(r){clearSelectedTickets();setStatus(r.message||'Tickets removed from batch. Reloading...');reloadBatches();}).withFailureHandler(function(e){setStatus('Remove from batch failed: '+String(e&&e.message?e.message:e));updateSelectionToolbar();}).removeTicketsFromBatch({source:REVIEW_QUEUE_SOURCE,validationRecordIds:ids,targetBatchRecordId:targetBatchRecordId});
}
